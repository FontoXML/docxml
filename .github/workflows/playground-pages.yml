name: Playground Pages

on:
    workflow_run:
        workflows:
            - Publish to JSR
        types:
            - completed
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to deploy (branch, tag, or commit SHA)
                required: false
                type: string

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        # Skip when the publish failed: the pinned docxml version would not exist on JSR.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.9.5

            - name: Build playground
              run: deno task playground:build

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload playground artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: playground/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
