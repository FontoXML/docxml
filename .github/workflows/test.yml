name: Tests

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Setup repo
              uses: actions/checkout@v4

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.8.0

            - name: Deno CI
              run: deno ci

            - name: Run linter
              run: deno task lint

            - name: Run tests
              run: deno task test
